# Windows o'rnatuvchisini (NSIS .exe) yig'ish va Release'ga qo'shish.
# Ishga tushadi: `v*` tegi push qilinganda yoki qo'lda (Actions → Desktop → Run workflow).
name: Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: ver
        shell: bash
        run: echo "v=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npm run build:desktop
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: TTA-CLAUDE-windows
          path: release/*.exe
          if-no-files-found: error
      - name: Release (teg yoki qo'lda ishga tushirilganda VERSION bo'yicha)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: TTA CLAUDE v${{ steps.ver.outputs.v }}
          files: release/*.exe
          generate_release_notes: true

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Haqiqiy Claude Code binari bilan integratsiya (soxta API)
        run: RUN_REAL=1 node --test dist/tests/real-engine.test.js
